<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>โปรไฟล์ของฉัน | What to Eat</title>
  <link href="css/style.css" rel="stylesheet"/>
  <style>
    .profile-wrapper {
      max-width: 950px;
      margin: 40px auto;
    }

    /* Profile Main Container */
    .profile-card-fancy {
      background: #ffffff;
      border: 3.5px solid #111111;
      border-radius: 20px;
      box-shadow: 8px 8px 0px #111111;
      overflow: hidden;
      margin-bottom: 30px;
      position: relative;
    }

    /* Cover Banner & Theme Selector */
    .profile-cover {
      height: 180px;
      background: linear-gradient(135deg, #ff472e 0%, #ff8c42 50%, #facc15 100%);
      position: relative;
      border-bottom: 3.5px solid #111111;
      transition: background 0.3s ease;
    }

    .cover-picker-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #ffffff;
      border: 2px solid #111111;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 3px 3px 0px #111111;
      transition: all 0.15s;
    }

    .cover-picker-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #111111;
    }

    /* Avatar Styling */
    .profile-avatar-wrap {
      position: absolute;
      bottom: -55px;
      left: 36px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3.5px solid #111111;
      background: #ffffff;
      box-shadow: 5px 5px 0px #111111;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .profile-avatar-wrap:hover {
      transform: scale(1.03);
    }

    .profile-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-avatar-wrap .avatar-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .profile-avatar-wrap:hover .avatar-overlay {
      opacity: 1;
    }

    /* Profile Inner Content */
    .profile-content {
      padding: 70px 36px 36px 36px;
    }

    .profile-header-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 20px;
    }

    .profile-name {
      font-size: 32px;
      font-weight: 900;
      color: #111111;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }

    .profile-email {
      color: #4b5563;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .profile-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #fef2f2;
      border: 2px solid #111111;
      color: #ff472e;
      font-weight: 800;
      font-size: 13px;
      border-radius: 99px;
      box-shadow: 2px 2px 0px #111111;
    }

    /* Stats Grid Widget */
    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin: 28px 0;
    }

    .stat-box {
      background: #f9fafb;
      border: 2.5px solid #111111;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      box-shadow: 4px 4px 0px #111111;
      transition: transform 0.2s ease;
    }

    .stat-box:hover {
      transform: translateY(-3px);
    }

    .stat-number {
      font-size: 26px;
      font-weight: 900;
      color: #111111;
    }

    .stat-label {
      font-size: 13px;
      color: #6b7280;
      font-weight: 700;
      margin-top: 4px;
    }

    .profile-actions-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Neo-Brutalism Tab Controls */
    .profile-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      border-bottom: 3.5px solid #111111;
      padding-bottom: 12px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 10px 22px;
      font-weight: 800;
      font-size: 16px;
      background: #ffffff;
      border: 2.5px solid #111111;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 3px 3px 0px #111111;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #111111;
    }

    .tab-btn.active {
      background: #ff472e;
      color: #ffffff;
      box-shadow: 4px 4px 0px #111111;
    }
  </style>
</head>
<body>
  <div class="topbar">GOOD FOOD. GOOD MOOD. GOOD STORIES. ✳</div>
  
  <header class="container nav">
    <a class="logo" href="index.html">WHAT <span>TO EAT</span> ✳</a>
    <nav class="navlinks">
      <a href="index.html">หน้าแรก</a>
      <a href="explore.html">สำรวจรีวิว</a>
      <a href="categories.html">หมวดหมู่</a>
      <a href="trending.html">ยอดนิยม</a>
      <a href="write-review.html">เขียนรีวิว</a>
    </nav>
    <div class="nav-actions" id="nav-actions"></div>
  </header>

  <main class="container profile-wrapper">
    <!-- กล่องโปรไฟล์ -->
    <div id="profile-container">
      <div class="empty">กำลังโหลดข้อมูลโปรไฟล์...</div>
    </div>

    <!-- แท็บสลับหน้า (ตัดส่วนเหรียญรางวัลออกแล้ว) -->
    <div class="profile-tabs">
      <button type="button" class="tab-btn active" id="tab-my-reviews">✍️ รีวิวของฉัน</button>
      <button type="button" class="tab-btn" id="tab-favorites">⭐ รายการโปรด</button>
    </div>

    <!-- พื้นที่แสดงข้อมูลรีวิว / รายการโปรด -->
    <div id="tab-content-area">
      <div class="review-grid" id="profile-review-list">
        <div class="empty">กำลังโหลดข้อมูล...</div>
      </div>
    </div>
  </main>

  <!-- Input ซ่อนสำหรับเลือกรูปภาพโปรไฟล์ และ รูปปกหลัง -->
  <input type="file" id="avatar-input" accept="image/*" style="display: none;">
  <input type="file" id="cover-input" accept="image/*" style="display: none;">

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <a class="logo" href="index.html">WHAT <span>TO EAT</span> ✳</a>
        <p>พื้นที่เล็ก ๆ สำหรับคนรักอาหารและเรื่องเล่าจานโปรด</p>
      </div>
      <div>
        <b>กินให้อร่อย แล้วเล่าให้ฟัง ♡</b>
        <p>&copy; 2026 What to Eat &middot; Food Review Community</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/zod@3.22.4/lib/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Project Main Script -->
  <script src="js/app.js"></script>
</body>
</html>
